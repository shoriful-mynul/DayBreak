<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daybreak — News Preview</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3e9;
      color: #242424;
      font-family: Georgia, serif;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 22px 60px;
    }

    header {
      padding: 24px 0;
      text-align: center;
      border-top: 4px solid #242424;
      border-bottom: 2px solid #242424;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 9vw, 76px);
      letter-spacing: -3px;
    }

    .subtitle,
    .toolbar,
    .meta,
    .note,
    button,
    .source-link {
      font-family: Arial, sans-serif;
    }

    .subtitle,
    .note {
      color: #625e56;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 4px;
      background: #702b35;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #warnings {
      color: #854815;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    #stories {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      margin-top: 12px;
    }

    article {
      padding-top: 18px;
      border-top: 1px solid #bdb7aa;
      overflow-wrap: anywhere;
    }

    article h2 {
      margin: 12px 0;
      font-size: 25px;
      line-height: 1.2;
    }

    article p {
      line-height: 1.65;
    }

    .meta {
      font-size: 12px;
      color: #625e56;
      line-height: 1.6;
    }

    .source-link {
      display: inline-block;
      margin-top: 8px;
      color: #702b35;
      font-weight: bold;
    }

    @media (max-width: 850px) {
      #stories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      #stories {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>DAYBREAK</h1>
      <p class="subtitle">
        News preview · Personalization comes next
      </p>
    </header>

    <div class="toolbar">
      <p id="status" role="status">Ready to collect news.</p>
      <button id="refresh" type="button">Refresh news</button>
    </div>

    <p class="note">
      Briefs below are publisher-provided feed excerpts.
      Open the original article for full reporting.
    </p>

    <div id="warnings" role="status"></div>
    <section id="stories" aria-label="News stories"></section>
  </main>

  <script>
    const statusElement = document.getElementById("status");
    const warningsElement = document.getElementById("warnings");
    const storiesElement = document.getElementById("stories");
    const refreshButton = document.getElementById("refresh");

    function formatDate(value) {
      if (!value) return "Publication time unavailable";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Publication time unavailable";
      }

      return date.toLocaleString();
    }

    function createStory(story) {
      const article = document.createElement("article");

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent =
        `${story.source} · ${story.topic.toUpperCase()}`;

      const title = document.createElement("h2");
      title.textContent = story.title;

      const date = document.createElement("div");
      date.className = "meta";
      date.textContent = formatDate(story.published_at);

      const excerpt = document.createElement("p");
      excerpt.textContent =
        story.excerpt || "No excerpt supplied by the publisher.";

      const link = document.createElement("a");
      link.className = "source-link";
      link.href = story.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = `Read original at ${story.source} ↗`;

      article.append(meta, title, date, excerpt, link);

      return article;
    }

    async function loadNews() {
      refreshButton.disabled = true;
      statusElement.textContent = "Collecting news from sources...";
      warningsElement.textContent = "";

      try {
        const response = await fetch("/api/news");

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }

        const data = await response.json();

        storiesElement.replaceChildren();

        for (const story of data.articles) {
          storiesElement.appendChild(createStory(story));
        }

        statusElement.textContent = data.count
          ? `${data.count} stories from ${data.sources_loaded.length} sources`
          : "No news loaded. Check the source warnings below.";

        warningsElement.textContent = data.warnings.join(" ");
      } catch (error) {
        statusElement.textContent =
          "Could not load news. Check your terminal and connection.";

        warningsElement.textContent = error.message;
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadNews);
    loadNews();
  </script>
</body>
</html>
